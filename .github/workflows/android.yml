name: Android CI

on:
  push:
    branches: [main, "claude/**"]
    # Reine Doku- oder Datenänderungen brauchen keinen App-Build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - scripts/build_data.py
      - .github/workflows/data.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - scripts/build_data.py
      - .github/workflows/data.yml
  workflow_dispatch:

# Nur ein Lauf zur Zeit pro Branch, damit sich Releases nicht überschneiden.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit-Tests (core)
        run: ./gradlew :core:test
      - name: Release-APK bauen (verkleinert) und Lint
        run: ./gradlew :app:assembleRelease :app:lintDebug
      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk garbageview.apk
          ls -l garbageview.apk
      # Bei Pushes liegt die APK im Release "prototyp"; nur für Pull Requests kurz aufbewahren.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: garbageview-apk
          path: garbageview.apk
          retention-days: 3
      # Vorab-Release "prototyp" mit der APK als direktem Download aktualisieren.
      - name: Prototyp-Release aktualisieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(du -m garbageview.apk | cut -f1)
          NOTES="Automatischer Build von \`${GITHUB_REF_NAME}\` (Commit ${GITHUB_SHA::7}, Lauf #${GITHUB_RUN_NUMBER}), ca. ${SIZE} MB.

          Installation: garbageview.apk auf dem Android-Gerät herunterladen und öffnen. Dafür muss die Installation aus unbekannten Quellen erlaubt sein.

          Nur zum Testen, nicht für den Play Store."
          gh release delete prototyp --yes --cleanup-tag || true
          gh release create prototyp garbageview.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Prototyp (Build #${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES"

  # Startet die App im Emulator und prüft, ob Standorte geladen und angezeigt werden.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug-APK bauen (enthält x86_64 für den Emulator)
        run: ./gradlew :app:assembleDebug
      - name: Auf Standortdaten warten (Release "daten", siehe data.yml)
        run: |
          for i in $(seq 1 50); do
            curl -fsIL -o /dev/null https://github.com/${{ github.repository }}/releases/download/daten/index.json && exit 0
            echo "Noch keine Standortdaten, warte 30 s ($i/50)"; sleep 30
          done
          echo "::error::Release daten/index.json nicht gefunden"; exit 1
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke-screenshot.png
            smoke-logcat.txt
          retention-days: 3
      - name: Screenshot an das Release hängen
        if: always() && github.event_name != 'pull_request' && hashFiles('smoke-screenshot.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload prototyp smoke-screenshot.png --clobber
